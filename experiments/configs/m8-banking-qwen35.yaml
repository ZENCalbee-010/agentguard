# M8 main experiment (narrower banking study), frozen by commit before the first run. Changing any field
# after the first run invalidates it (docs/research/m8-analysis-plan.md). Analysis: experiments/scripts/m8/analyze_main.py.
experiment_id: m8-banking-qwen35
